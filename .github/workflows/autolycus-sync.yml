name: Sync with upstream Hermes Agent
on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force push even on auto-merge (ignores conflicts)'
        required: false
        type: boolean
        default: false

# GITHUB_TOKEN (app) cannot push workflow-file changes by design.
# We therefore never merge upstream's .github/ into our history.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: autolycus-sync
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout autolycus
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # token omitted → uses the built-in GITHUB_TOKEN (always valid).

      - name: Configure git
        run: |
          git config user.name "Autolycus Sync Bot"
          git config user.email "bot@autolycus-agent.ru"

      - name: Save adapted files before merge
        run: |
          # These files are adapted for Autolycus — save them before upstream overwrites
          mkdir -p /tmp/autolycus-save/hermes_cli /tmp/autolycus-save/acp_adapter
          for f in README.md SECURITY.md AGENTS.md \
            hermes_constants.py cli.py pyproject.toml \
            hermes_cli/__init__.py hermes_cli/banner.py \
            hermes_cli/main.py hermes_cli/setup.py \
            acp_adapter/server.py install.sh; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/autolycus-save/$f"
              echo "✓ Saved $f"
            fi
          done

      - name: Fetch upstream
        run: |
          # Public repo → anonymous fetch. Disable any credential helper so the
          # runner's GITHUB_TOKEN is never offered to a foreign repository.
          git -c credential.helper= remote add upstream https://github.com/NousResearch/hermes-agent.git
          git -c credential.helper= fetch upstream main

      - name: Count new commits
        id: count
        run: |
          COUNT=$(git rev-list --count main..upstream/main 2>/dev/null || echo 0)
          echo "commits=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $COUNT"

      - name: No updates
        if: steps.count.outputs.commits == '0'
        run: echo "Already up to date, nothing to merge"

      - name: Merge upstream (no commit yet)
        if: steps.count.outputs.commits != '0'
        id: merge
        run: |
          # Merge but do NOT auto-commit. We strip .github/ before committing.
          git merge --no-ff --no-commit upstream/main --no-edit 2>&1 || echo "MERGE_CONFLICT" >> .merge_status
          echo "Merge staged"

      - name: Resolve conflicts (prefer upstream, keep Autolycus adaptations)
        if: steps.count.outputs.commits != '0'
        run: |
          # 1) Restore Autolycus-adapted versions of protected files
          for f in README.md SECURITY.md AGENTS.md \
            hermes_constants.py cli.py pyproject.toml \
            hermes_cli/__init__.py hermes_cli/banner.py \
            hermes_cli/main.py hermes_cli/setup.py \
            acp_adapter/server.py install.sh; do
            if [ -f "/tmp/autolycus-save/$f" ]; then
              cp "/tmp/autolycus-save/$f" "$f"
              git add "$f"
              echo "✓ Restored Autolycus adaptation: $f"
            fi
          done
          # 2) Any remaining conflicted file → take upstream version
          UNRESOLVED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$UNRESOLVED" ]; then
            echo "Resolving in favor of upstream:"
            echo "$UNRESOLVED"
            for f in $UNRESOLVED; do
              git checkout upstream/main -- "$f" 2>/dev/null || git checkout --theirs -- "$f"
              git add "$f"
            done
          else
            echo "No unresolved conflicts."
          fi
          rm -f .merge_status

      - name: Apply autolycus rebranding
        if: steps.count.outputs.commits != '0' && !cancelled()
        run: |
          bash scripts/apply-autolycus-rebrand.sh
          echo "Rebranding applied"

      - name: Commit and push (strip upstream .github)
        if: steps.count.outputs.commits != '0'
        run: |
          # Never let upstream overwrite our CI. HEAD is still pre-merge main
          # (we used --no-commit), so this restores our own .github tree.
          git checkout HEAD -- .github 2>/dev/null || true
          git add -A
          git commit --no-edit 2>/dev/null || echo "Nothing to commit"
          git push origin main
