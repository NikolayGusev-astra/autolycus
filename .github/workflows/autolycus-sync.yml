name: Sync with upstream Hermes Agent
on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force push even on auto-merge (ignores conflicts)'
        required: false
        type: boolean
        default: false

# GITHUB_TOKEN (GitHub App) cannot push commits that touch workflow files.
# After the one-time bootstrap (main reset to upstream/main), the daily push is a
# fast-forward where .github/ is unchanged vs the server, so it is allowed.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: autolycus-sync
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout autolycus
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # token omitted → uses the built-in GITHUB_TOKEN (always valid).

      - name: Configure git
        run: |
          git config user.name "Autolycus Sync Bot"
          git config user.email "bot@autolycus-agent.ru"

      - name: Save adapted files before reset
        run: |
          # These files are adapted for Autolycus — save them before we reset to upstream.
          mkdir -p /tmp/autolycus-save/hermes_cli /tmp/autolycus-save/acp_adapter
          for f in README.md SECURITY.md AGENTS.md \
            hermes_constants.py cli.py pyproject.toml \
            hermes_cli/__init__.py hermes_cli/banner.py \
            hermes_cli/main.py hermes_cli/setup.py \
            acp_adapter/server.py install.sh; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/autolycus-save/$f"
              echo "✓ Saved $f"
            fi
          done

      - name: Fetch upstream
        run: |
          # Public repo → anonymous fetch. Disable any credential helper so the
          # runner's GITHUB_TOKEN is never offered to a foreign repository.
          git -c credential.helper= remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git -c credential.helper= fetch upstream main

      - name: Count new commits
        id: count
        run: |
          COUNT=$(git rev-list --count main..upstream/main 2>/dev/null || echo 0)
          echo "commits=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $COUNT"

      - name: No updates
        if: steps.count.outputs.commits == '0'
        run: echo "Already up to date, nothing to merge"

      - name: Reset to upstream, reapply Autolycus adaptations
        if: steps.count.outputs.commits != '0'
        run: |
          # Hard-reset local main to upstream. This avoids carrying 3175 commit
          # objects in the push (the thing that broke GITHUB_TOKEN before).
          git reset --hard upstream/main

          # 1) Restore Autolycus-adapted files (protected)
          for f in README.md SECURITY.md AGENTS.md \
            hermes_constants.py cli.py pyproject.toml \
            hermes_cli/__init__.py hermes_cli/banner.py \
            hermes_cli/main.py hermes_cli/setup.py \
            acp_adapter/server.py install.sh; do
            if [ -f "/tmp/autolycus-save/$f" ]; then
              cp "/tmp/autolycus-save/$f" "$f"
              git add "$f"
              echo "✓ Restored Autolycus adaptation: $f"
            fi
          done

          # 2) Keep OUR .github/ (our CI) — never let upstream clobber it.
          # origin/main already holds our .github, identical to the server.
          git fetch origin main
          git checkout origin/main -- .github 2>/dev/null || true
          git add -A
          git commit --no-edit 2>/dev/null || echo "Nothing to commit"
          git push origin main
