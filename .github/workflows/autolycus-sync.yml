name: Sync with upstream Hermes Agent
on:
  schedule:
    - cron: '0 6 * * 1'  # Каждый понедельник в 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force push even on auto-merge (ignores conflicts)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: autolycus-sync
    steps:
      - name: Checkout autolycus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name "Autolycus Sync Bot"
          git config user.email "bot@autolycus-agent.ru"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Count new commits
        id: count
        run: |
          COUNT=$(git rev-list --count main..upstream/main 2>/dev/null || echo 0)
          echo "commits=$COUNT" >> $GITHUB_OUTPUT
          echo "New upstream commits: $COUNT"

      - name: No updates
        if: steps.count.outputs.commits == '0'
        run: echo "Already up to date, nothing to merge"

      - name: Merge upstream
        if: steps.count.outputs.commits != '0'
        id: merge
        run: |
          git merge --no-ff upstream/main --no-edit 2>&1 || echo "CONFLICT" >> .merge_status
          echo "Merge completed"

      - name: Check for conflicts
        if: steps.count.outputs.commits != '0'
        run: |
          if [ -f .merge_status ]; then
            echo "::warning::Conflicts detected — manual resolution required"
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
            exit 0  # Don't fail the workflow, just warn
          fi

      - name: Push
        if: steps.count.outputs.commits != '0' && !cancelled()
        run: |
          if [ -f .merge_status ]; then
            echo "Conflicts exist — push to a sync-branch instead of main"
            BRANCH="sync/upstream-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            echo "Pushed to $BRANCH — create PR for review"
          else
            git push origin main
          fi
